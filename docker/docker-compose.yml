services:
  postgres:
    image: postgres:16
    container_name: catalogue-db
    environment:
      POSTGRES_DB: catalogue
      POSTGRES_USER: catalogue
      POSTGRES_PASSWORD: catalogue
    ports:
      - "5433:5432"

  manager-db:
    image: postgres:16
    container_name: manager-db
    environment:
      POSTGRES_DB: manager
      POSTGRES_USER: manager
      POSTGRES_PASSWORD: manager
    ports:
      - "5434:5432"